services:
  rss-fulltext:
    image: ghcr.io/mijndert/rss-fulltext:latest
    container_name: rss-fulltext
    ports:
      # Published on loopback only. Put a reverse proxy in front to expose it.
      - "127.0.0.1:8080:8080"
    environment:
      # Listen on all interfaces inside the container (the binary defaults to
      # loopback, which would be unreachable from the published port).
      LISTEN_ADDR: ":8080"
      # feeds.yaml lives in the mounted ./config directory (see volumes below).
      CONFIG_PATH: "/etc/rss-fulltext/feeds.yaml"
      # Everything else (cache TTL, timeouts, size caps, concurrency, …) uses
      # sensible built-in defaults. See the README "Advanced configuration"
      # table if you need to override any of them.
    volumes:
      # Mount the directory, not the file: edits to ./config/feeds.yaml on the
      # host are then picked up live (no restart), including from editors that
      # save by replacing the file.
      - ./config:/etc/rss-fulltext:ro
      - data:/var/lib/rss-fulltext
    # Security hardening: run with a read-only root filesystem, drop all Linux
    # capabilities, and forbid privilege escalation. The named volume below stays
    # writable for the cache and generated feeds.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  data:
